<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <button id="themeBtn">🌙 Dark Mode</button>


    <!-- Filter Buttons -->
    <div class="filters">
        <button class="active" data-filter="all">All</button>
        <button data-filter="nature">Nature</button>
        <button data-filter="city">City</button>
        <button data-filter="animals">Animals</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">
        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1015/600/400" alt="nature">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1011/600/400" alt="nature">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1025/600/400" alt="animals">
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1031/600/400" alt="city">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/237/600/400" alt="animals">
        </div>
        
        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1003/600/400" alt="animals">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1006/600/400" alt="Nature">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1024/600/400" alt="Animal">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1039/600/400" alt="Nature">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1043/600/400" alt="Nature">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1062/600/400" alt="Animal">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1056/600/400" alt="Nature">
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1067/600/400" alt="City">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1074/600/400" alt="Animal">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1084/600/400" alt="animals">
        </div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox">
        <span class="close">&times;</span>
        <button class="prev">&#10094;</button>
        <img class="lightbox-img" src="" alt="">
        <button class="next">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
